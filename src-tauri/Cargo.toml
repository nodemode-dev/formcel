[package]
name = "formcel-desktop"
version = "0.40.0"
description = "FormCel desktop shell"
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde_json = "1"
fontdb = "0.24"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSButton", "NSControl", "NSColor", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = false
panic = "abort"

[profile.release.build-override]
strip = false

[workspace]
