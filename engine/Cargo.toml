[workspace]
resolver = "2"
members = ["crates/formcel-core", "crates/formcel-wasm", "crates/formcel-py"]

[workspace.package]
version = "0.40.0"
edition = "2021"
license = "Apache-2.0"
authors = ["nodemode-ai <mackin@nodemode.ai>"]
repository = "https://github.com/nodemode-ai/formcel"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = false

[profile.release.build-override]
strip = false
