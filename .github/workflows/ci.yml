name: ci

on:
  push:
    branches: [main, 'compile_v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run. Runs on main and compile_v* are never cancelled: formcompiler
# releases a commit only when this workflow passed on that exact commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r requirements.txt
      - name: Build the engine module (formcel-py), as backend/oc_install does
        run: pip install --force-reinstall --no-deps ../engine/crates/formcel-py
      - run: python -m compileall -q app
      - name: Boot the engine and probe it
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8199 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8199/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8199/api/health

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Engine and test dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Build the engine module (formcel-py)
        working-directory: backend
        run: pip install --force-reinstall --no-deps ../engine/crates/formcel-py
      - name: Family layers, formulas, files and script runners
        working-directory: backend
        run: python -m pytest tests -q -p no:cacheprovider

  window:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Apt mirror fallback
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            grep -q mirrors.edge.kernel.org /etc/apt/apt-mirrors.txt || printf 'http://mirrors.edge.kernel.org/ubuntu/\tpriority:1\n' | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
            grep -q '//archive.ubuntu.com' /etc/apt/apt-mirrors.txt || printf 'http://archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf 'Acquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the window's engine (formcel-wasm), as engine/build_wasm does
        working-directory: engine
        run: ./build_wasm
      - name: Build the window
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Engine, pytest and Playwright
        run: |
          pip install -r backend/requirements.txt pytest==9.1.1 playwright==1.63.0
          pip install --force-reinstall --no-deps engine/crates/formcel-py
          python -m playwright install --with-deps chromium
      - name: Window smoke (F7)
        run: python -m pytest frontend/tests/window -q -p no:cacheprovider

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in formcel formcel_oc_install build_app backend/oc_install backend/boot_backend frontend/oc_install frontend/boot_frontend setup/*; do
            case "$f" in *.bat|*.py) continue ;; esac
            bash -n "$f"
          done
      - name: No em dash or emoji in tracked markdown
        run: |
          python3 - <<'PY'
          import subprocess, sys
          bad = []
          for path in subprocess.check_output(['git', 'ls-files', '*.md'], text=True).split():
              try:
                  text = open(path, encoding='utf-8').read()
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              for ch in text:
                  cp = ord(ch)
                  if cp == 0x2014 or 0x1F000 <= cp <= 0x1FAFF or 0x2600 <= cp <= 0x27BF:
                      bad.append(f'{path}: U+{cp:04X}')
                      break
          print('\n'.join(bad) or 'clean')
          sys.exit(1 if bad else 0)
          PY
      - name: No sparkle icon
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          banned = re.compile("\\bsparkle\\s*:\\s*[`'\"]?\\s*<svg|\\bsparkle\\s*:\\s*\\w+\\(|icon\\(\\s*['\"]sparkle['\"]|M12 1\\.5l1\\.5 4\\.5 4\\.5 1\\.5|"
                              "M7\\.5 5\\.6L10 7 8\\.6 4\\.5|M12 4l1\\.8 5\\.2L19 11|M17\\.500 4l1 2\\.500 2\\.500 1|M19 3\\.500l\\.6 1\\.500|[\\u2726\\u2727\\u2728\\u2734\\u2747]")
          files = subprocess.check_output(['git', 'ls-files', 'frontend/src', 'frontend/public', 'frontend/index.html', 'backend/app', 'src-tauri/src'], text=True).split()
          bad = []
          for path in files:
              if not path.endswith(('.ts', '.py', '.rs', '.css', '.html', '.svg')) or '/i18n/' in path or path.endswith('.test.ts'):
                  continue
              try:
                  lines = open(path, encoding='utf-8').read().splitlines()
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              for n, line in enumerate(lines, 1):
                  if banned.search(line):
                      bad.append(f'{path}:{n}: the sparkle icon is banned app-wide (the owner\'s rule); use agent, agentChat or terminal')
          print('\n'.join(bad) or 'clean')
          sys.exit(1 if bad else 0)
          PY
